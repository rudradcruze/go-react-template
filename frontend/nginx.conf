# This is the configuration of the web container. It serves the frontend, and it sends the API requests to the api service.

# Docker has a DNS server at 127.0.0.11. nginx asks it again every 10 seconds, so nginx finds the api service
# at its new address after Compose creates the service again.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # A body of up to 2 MiB reaches the API, and the API answers a body of more than 1 MiB with its own 413 problem detail.
    # nginx rejects a body of more than 2 MiB, and it answers with the same kind of problem detail.
    client_max_body_size 2m;
    error_page 413 = @payload_too_large;

    include /etc/nginx/security-headers.conf;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location @payload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Request Entity Too Large","status":413,"detail":"The request body is larger than 2 MiB. Send a smaller body."}';
    }

    # The container platform uses this route to see that nginx runs. The API has its own route with the same path.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API, its docs and its spec. The pattern also takes /api and /docs/, so the API answers with its own error
    # and not with the page of the frontend. The port must be the same as API_PORT in compose.yaml.
    location ~ ^/(api|docs|openapi\.yaml)(/|$) {
        set $api http://api:5653;
        proxy_pass $api;
    }

    # The names of these files have a hash, so a browser can keep them for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The pages of the frontend. The router in the browser handles a path that is not a file.
    # The Content Security Policy (CSP) lets the page load only its own files. It does not apply to the docs of the API.
    location / {
        expires -1;
        # A location with its own add_header does not inherit the headers of the server, so include them again.
        include /etc/nginx/security-headers.conf;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
